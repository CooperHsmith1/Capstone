[pytest]
testpaths = tests
python_files = test_*.py
# Collect only the tests directory. The package root's __init__.py imports the
# mjlab task registry, which is unavailable on a plain torch machine; keeping
# collection scoped to tests/ is what lets the state-estimation suite run on a
# laptop or CI box before the simulator is installed.
norecursedirs = mdp config .git __pycache__
addopts = -q --import-mode=importlib
